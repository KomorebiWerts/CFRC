[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papc"]

[project]
name = "papc"
version = "0.1.0"
description = "Commitment-Frontier Residual Completion (CFRC) for stateful agent handoffs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    { name = "Runzhi Deng" }, { name = "Yiming Zhong" }, { name = "Fang Zhao" }, { name = "Pan Zhou" }
]
dependencies = [
    "rich",
    "tabulate>=0.9.0",
    "pandas>=2.2.3",
    "psutil>=7.0.0",
    "loguru>=0.7.3",
    "docstring-parser>=0.16",
    "litellm>=1.80.15,<1.82.7",
    "tenacity>=9.0.0",
    "deepdiff>=8.4.2",
    "addict>=2.4.0",
    "PyYAML>=6.0.2",
    "toml>=0.10.2",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "pydantic>=2.12,<3",
    "sympy>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "psycopg2-binary>=2.9.9,<3",
    "sqlglot>=25,<27",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.1",
]
claude-subscription = [
    "claude-agent-sdk>=0.2.121,<0.3",
]

[project.scripts]
papc-run = "papc.run:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "F541"]

[tool.ruff]
line-length = 88
exclude = ["*.ipynb"]
